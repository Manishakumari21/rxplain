[package]
name = "rxplain"
version = "0.1.0"
edition = "2024"
description = "A deterministic, offline Rust compiler error explainer with safe auto-fixes"
license = "MIT"
repository = "https://github.com/Manishakumari21/rxplain"
readme = "README.md"
keywords = [
    "rust",
    "compiler",
    "diagnostics",
    "error",
    "explainer",
    "borrow-checker",
    "ownership",
    "lifetimes",
    "tui",
]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
anyhow = "1"
indicatif = "0.17"
ratatui = "0.29"
crossterm = "0.28"
