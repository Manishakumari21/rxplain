name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test + benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Run benchmark
        run: bash benchmark/run.sh

  release:
    name: Release build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/rxplain-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz rxplain

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rxplain-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
